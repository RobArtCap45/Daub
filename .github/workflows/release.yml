name: Release

# Build installers for macOS, Windows and Linux.
#   - Push a tag like v0.1.0           -> builds everything and attaches it to a DRAFT GitHub release
#   - Run it by hand (Actions tab)     -> builds everything and keeps the installers as workflow artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: mac }
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      # Code signing is optional (see docs/desktop.md). Certificates are only handed to electron-builder when the
      # secrets exist: an empty CSC_LINK counts as "a certificate file at this path" and fails the build.
      - name: Use signing certificates if provided
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CSC_LINK" ]; then
              echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
              echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
              if [ -n "$APPLE_ID" ]; then
                echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
                echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
              fi
            else
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
              echo "No macOS certificate provided: building unsigned."
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$WIN_CSC_LINK" ]; then
              echo "WIN_CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"
              echo "WIN_CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            else
              echo "No Windows certificate provided: building unsigned."
            fi
          fi

      - name: Build installers
        run: npx electron-builder --${{ matrix.target }} --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers (manual runs)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
