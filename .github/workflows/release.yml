name: Release

# Build installers for macOS, Windows and Linux.
#   - Push a tag like v0.1.0           -> builds everything and attaches it to a DRAFT GitHub release
#   - Run it by hand (Actions tab)     -> builds everything and keeps the installers as workflow artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      # Code signing is optional. Without the secrets below the installers are built unsigned
      # (see docs/desktop.md for how to add them). macOS notarization needs the APPLE_* secrets too.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish ${{ env.PUBLISH }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the installers (manual runs)
        if: env.PUBLISH == 'never'
        uses: actions/upload-artifact@v4
        with:
          name: loom-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
